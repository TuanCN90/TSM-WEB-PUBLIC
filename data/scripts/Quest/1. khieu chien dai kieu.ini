//Khiêu Chiến Đại Kiều
auto 1
setting 0
save_map 0
leave_party
loop 999
	click 49,12003,490,590,4000
	if_item 29630 > 0
		if_item 29630 < 5
			menu 1
	if_item 29630 >= 5
		if_item 29630 < 10
			menu 2
	if_item 29630 >= 10
		if_item 29630 < 50
			menu 3
	if_item 29630 >= 50
		menu 4
	send 1
	await_battle
	sleep 2000
	if_item 29630 == 0
		save_map 1
		channel 0
		setting 1
		stop