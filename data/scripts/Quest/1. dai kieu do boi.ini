auto 1
setting 0
save_map 0
leave_party

//Đại Kiều Đồ Bơi
loop 999
	click 28,12011,830,410,4000
	if_item 29624 > 0
		if_item 29641 < 10
			menu 1
	if_item 29624 >= 10
		if_item 29641 < 50
			menu 2
	if_item 29624 >= 50
		if_item 29641 < 100
			menu 3
	if_item 29624 >= 100
		menu 4
	send 1
	await_battle
	sleep 2000
	if_item 29624 == 0
		save_map 1
		channel 0
		setting 1
		stop